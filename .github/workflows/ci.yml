name: Lab 8 CI/CD & Kubernetes Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Run Microservices Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            api-gateway/package-lock.json
            user-service/package-lock.json
            product-service/package-lock.json
            order-service/package-lock.json

      - name: Install Dependencies
        run: |
          npm ci --prefix api-gateway
          npm ci --prefix user-service
          npm ci --prefix product-service
          npm ci --prefix order-service

      - name: Run Microservices Tests
        run: |
          npm test

  validate-k8s:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate YAML Manifests
        run: |
          npm ci --ignore-scripts
          node scripts/validate-k8s.js

      - name: Create local kind cluster for dry-run schema validation
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: kind-ci

      - name: Validate Manifests against Kubernetes Cluster API
        run: |
          kubectl apply -f k8s/00-namespace.yaml
          kubectl apply --dry-run=client -f k8s/00-namespace.yaml
          kubectl apply --dry-run=client -f k8s/01-configmap.yaml
          kubectl apply --dry-run=client -f k8s/02-secrets.yaml.example
          kubectl apply --dry-run=client -f k8s/user-service.yaml
          kubectl apply --dry-run=client -f k8s/product-service.yaml
          kubectl apply --dry-run=client -f k8s/order-service.yaml
          kubectl apply --dry-run=client -f k8s/api-gateway.yaml
          kubectl apply --dry-run=client -f k8s/monitoring/01-prometheus-configmap.yaml
          kubectl apply --dry-run=client -f k8s/monitoring/02-prometheus.yaml
          kubectl apply --dry-run=client -f k8s/monitoring/03-grafana-datasources.yaml
          kubectl apply --dry-run=client -f k8s/monitoring/04-grafana.yaml

  build-and-push:
    name: Build & Publish Container Images
    needs: [test, validate-k8s]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api-gateway, user-service, product-service, order-service]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Dual Registry Strategy: Uses Docker Hub if secrets exist, otherwise defaults to GitHub Packages (GHCR)
      - name: Determine Registry & Image Names
        id: meta
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          if [ -n "${{ secrets.DOCKER_USERNAME }}" ] && [ -n "${{ secrets.DOCKER_PASSWORD }}" ]; then
            DOCKER_USER_LOWER=$(echo "${{ secrets.DOCKER_USERNAME }}" | tr '[:upper:]' '[:lower:]')
            echo "REGISTRY_TYPE=dockerhub" >> $GITHUB_OUTPUT
            echo "IMAGE_NAME=${DOCKER_USER_LOWER}/${{ matrix.service }}" >> $GITHUB_OUTPUT
          else
            echo "REGISTRY_TYPE=ghcr" >> $GITHUB_OUTPUT
            echo "IMAGE_NAME=ghcr.io/${OWNER_LOWER}/${{ matrix.service }}" >> $GITHUB_OUTPUT
          fi

      - name: Log in to Docker Hub (Conditional)
        if: steps.meta.outputs.REGISTRY_TYPE == 'dockerhub'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GitHub Container Registry (Fallback)
        if: steps.meta.outputs.REGISTRY_TYPE == 'ghcr'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.meta.outputs.IMAGE_NAME }}:${{ github.sha }}
            ${{ steps.meta.outputs.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-rollout:
    name: Documented Rollout & Rollback Verification
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Rollout Commands & Target Tags
        run: |
          echo "=========================================================="
          echo "New images published successfully for commit ${{ github.sha }}:"
          echo "  - api-gateway:${{ github.sha }}"
          echo "  - user-service:${{ github.sha }}"
          echo "  - product-service:${{ github.sha }}"
          echo "  - order-service:${{ github.sha }}"
          echo "=========================================================="
          echo "To rollout new versions to your Kubernetes cluster:"
          echo "kubectl set image deployment/api-gateway api-gateway=<IMAGE>:${{ github.sha }} -n lab8"
          echo "kubectl set image deployment/user-service user-service=<IMAGE>:${{ github.sha }} -n lab8"
          echo "kubectl set image deployment/product-service product-service=<IMAGE>:${{ github.sha }} -n lab8"
          echo "kubectl set image deployment/order-service order-service=<IMAGE>:${{ github.sha }} -n lab8"
          echo ""
          echo "To verify rollout status:"
          echo "kubectl rollout status deployment/user-service -n lab8"
          echo "kubectl rollout status deployment/api-gateway -n lab8"
